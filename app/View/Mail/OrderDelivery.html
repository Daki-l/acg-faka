<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>订单已发货</title>
</head>
<body style="margin:0;padding:0;background:#f4f6f8;font-family:Arial,'Microsoft YaHei',sans-serif;color:#202124;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;background:#f4f6f8;">
    <tr>
        <td align="center" style="padding:32px 16px;">
            <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;background:#ffffff;">
                <tr>
                    <td style="padding:28px 32px 20px;border-bottom:1px solid #e8eaed;">
                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                            <tr>
                                <td width="54" valign="middle" style="width:54px;">
                                    <img src="{{logo_url}}" width="42" height="42" alt="Weiloo 小店" style="display:block;width:42px;height:42px;object-fit:contain;border:0;">
                                </td>
                                <td valign="middle" style="font-size:20px;font-weight:700;color:#202124;">Weiloo 小店</td>
                            </tr>
                        </table>
                    </td>
                </tr>
                <tr>
                    <td style="padding:30px 32px 12px;">
                        <h1 style="margin:0 0 12px;font-size:24px;line-height:32px;font-weight:700;color:#202124;">订单已发货</h1>
                        <p style="margin:0;font-size:15px;line-height:24px;color:#5f6368;">Weiloo 小店已为您的订单完成发货，订单信息如下。</p>
                    </td>
                </tr>
                <tr>
                    <td style="padding:12px 32px 4px;">
                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border:1px solid #e8eaed;border-collapse:collapse;">
                            <tr>
                                <td style="width:34%;padding:12px 14px;background:#f8f9fa;border-bottom:1px solid #e8eaed;font-size:14px;color:#5f6368;">订单号</td>
                                <td style="padding:12px 14px;border-bottom:1px solid #e8eaed;font-size:14px;color:#202124;word-break:break-all;">{{order_no}}</td>
                            </tr>
                            <tr>
                                <td style="padding:12px 14px;background:#f8f9fa;border-bottom:1px solid #e8eaed;font-size:14px;color:#5f6368;">订单时间</td>
                                <td style="padding:12px 14px;border-bottom:1px solid #e8eaed;font-size:14px;color:#202124;">{{order_time}}</td>
                            </tr>
                            <tr>
                                <td style="padding:12px 14px;background:#f8f9fa;border-bottom:1px solid #e8eaed;font-size:14px;color:#5f6368;">会员账号</td>
                                <td style="padding:12px 14px;border-bottom:1px solid #e8eaed;font-size:14px;color:#202124;word-break:break-all;">{{member_username}}</td>
                            </tr>
                            <tr>
                                <td style="padding:12px 14px;background:#f8f9fa;border-bottom:1px solid #e8eaed;font-size:14px;color:#5f6368;">商品</td>
                                <td style="padding:12px 14px;border-bottom:1px solid #e8eaed;font-size:14px;color:#202124;">{{product_name}}</td>
                            </tr>
                            <tr>
                                <td style="padding:12px 14px;background:#f8f9fa;font-size:14px;color:#5f6368;">数量</td>
                                <td style="padding:12px 14px;font-size:14px;color:#202124;">{{quantity}}</td>
                            </tr>
                        </table>
                    </td>
                </tr>
                <tr>
                    <td style="padding:20px 32px 4px;">
                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border:1px solid #e8eaed;border-collapse:collapse;">
                            <tr>
                                <td style="padding:12px 14px;border-bottom:1px solid #e8eaed;font-size:14px;color:#5f6368;">商品金额</td>
                                <td align="right" style="padding:12px 14px;border-bottom:1px solid #e8eaed;font-size:14px;color:#202124;">{{product_amount}}</td>
                            </tr>
                            <tr>
                                <td style="padding:12px 14px;border-bottom:1px solid #e8eaed;font-size:14px;color:#5f6368;">手续费</td>
                                <td align="right" style="padding:12px 14px;border-bottom:1px solid #e8eaed;font-size:14px;color:#202124;">{{service_fee}}</td>
                            </tr>
                            <tr>
                                <td style="padding:12px 14px;font-size:15px;font-weight:700;color:#202124;">总计</td>
                                <td align="right" style="padding:12px 14px;font-size:16px;font-weight:700;color:#188038;">{{total_amount}}</td>
                            </tr>
                        </table>
                    </td>
                </tr>
                <tr>
                    <td style="padding:20px 32px 4px;">
                        <p style="margin:0 0 8px;font-size:14px;color:#5f6368;">支付方式</p>
                        <p style="margin:0;font-size:15px;font-weight:700;color:#202124;">{{payment_method}}</p>
                    </td>
                </tr>
                <tr>
                    <td style="padding:20px 32px 32px;">
                        <p style="margin:0 0 8px;font-size:14px;color:#5f6368;">发货内容</p>
                        <div style="padding:16px;background:#f8f9fa;border:1px solid #e8eaed;font-family:Consolas,Monaco,monospace;font-size:14px;line-height:22px;color:#202124;word-break:break-all;">{{delivery_content}}</div>
                    </td>
                </tr>
                <tr>
                    <td style="padding:20px 32px 28px;background:#f8f9fa;border-top:1px solid #e8eaed;font-size:12px;line-height:20px;color:#80868b;">此邮件由 Weiloo 小店自动发送，请勿直接回复。</td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
